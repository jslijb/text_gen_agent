# AI漫剧/视频生成Prompt模板

## 选题生成Prompt

topic_generation: |
  你是一个快手AI漫剧选题专家。根据以下信息生成热门选题。

  热点话题:
  {hot_topics}

  对标账号分析:
  - 漫剧工厂:都市言情、玄幻,动态漫风格,系列化内容
  - 短剧研究所:悬疑反转,强钩子开头,悬念结尾
  - AI小说推文:霸总甜宠,图文轮播,批量生产

  成功要素:
  1. 强情节、快节奏、高反转
  2. 开头3秒抓眼球
  3. 标题15-25字,包含悬念词和情绪词
  4. 结尾留悬念引导追更

  标题规范:
  - 长度:17-30字
  - 包含悬念词:"真相揭晓"、"意外发现"、"结局反转"、"竟然"、"原来"
  - 包含情绪词:"虐心"、"高甜"、"泪目"、"震惊"、"可怕"
  - 包含题材词:"重生"、"穿越"、"霸总"、"复仇"、"逆袭"
  - 示例:
    - "重生回19岁,她做了一个让所有人震惊的决定..."
    - "结婚三年,我才知道他的真实身份#短剧#"
    - "保姆的女儿竟是我的亲生女儿#家庭伦理#"

  新号起步推荐题材:
  1. 都市言情(受众广、热度高)
  2. 悬疑反转(强钩子、高完播率)
  3. 家庭伦理(竞争低、易爆款)

  请生成3个选题,每个选题包含:
  1. 标题(17-30字,吸引眼球)
  2. 题材(都市言情/悬疑反转/家庭伦理/玄幻修真)
  3. 风格(comic/realistic/anime)
  4. 预期时长(15/30/60秒)
  5. 选题理由(为什么这个选题会火)

  返回JSON格式:
  {
    "topics": [
      {
        "title": "...",
        "genre": "...",
        "style": "...",
        "target_duration": 30,
        "reason": "..."
      }
    ]
  }

## 文案生成Prompt

script_generation: |
  你是一个AI漫剧文案专家。根据以下选题生成适合短视频的漫剧文案。

  选题:{topic}
  题材:{genre}
  风格:{style}
  目标时长:{target_duration}秒

  文案要求:
  1. 标题17-30字,符合快手平台规范
     - 包含悬念词:"真相揭晓"、"意外发现"、"结局反转"
     - 包含情绪词:"虐心"、"高甜"、"泪目"
  2. 适合AI漫剧叙事节奏,每5-10秒一个镜头切换
  3. 开头3秒必须有钩子(悬念、冲突、反转)
  4. 包含旁白、对话、音效提示
  5. 结尾留悬念引导追更("关注我,下集更精彩")
  6. 总时长控制在目标时长±10%

  优秀标题示例:
  - "重生回19岁,她做了一个让所有人震惊的决定..."
  - "结婚三年,我才知道他的真实身份#短剧#"
  - "保姆的女儿竟是我的亲生女儿#家庭伦理#"

  分镜节奏建议:
  - 动态漫:3秒一镜,快节奏
  - AI短剧:5秒一镜,强钩子开头,悬念结尾

  返回JSON格式:
  {
    "title": "...",
    "content": "完整的文案内容...",
    "shots": [
      {
        "sequence": 1,
        "duration": 5,
        "description": "画面描述",
        "narration": "旁白文本",
        "sound_effects": "音效提示"
      }
    ]
  }

## 分镜拆分Prompt

shot_splitting: |
  你是一个AI漫剧分镜师。将以下文案拆分为具体镜头。

  文案:{script}
  目标时长:{target_duration}秒

  分镜要求:
  1. 每个镜头2-5秒
  2. 总时长不超过目标时长
  3. 镜头间有转场提示(淡入淡出/切镜/缩放)
  4. 支持动态镜头(缩放、平移)提升视觉效果
  5. 每个镜头包含:
     - 画面描述(用于图像生成)
     - 旁白文本
     - 视频生成提示词
     - 时长
  6. 开头镜头必须有强视觉冲击(特写、冲突场景)
  7. 结尾镜头留悬念(背影、远景、未解之谜)

  分镜节奏建议:
  - 动态漫:3秒一镜,快节奏
  - AI短剧:5秒一镜,强钩子开头,悬念结尾
  - 图文轮播:10秒一页,快节奏

  返回JSON格式:
  {
    "shots": [
      {
        "sequence": 1,
        "description": "画面描述",
        "narration": "旁白文本",
        "duration": 5,
        "image_prompt": "用于生成图像的提示词",
        "video_prompt": "用于生成视频的提示词",
        "transition": "转场方式(淡入淡出/切镜/缩放)"
      }
    ]
  }

## 图像生成Prompt

image_generation: |
  生成AI漫剧角色/场景图像。

  描述:{description}
  风格:{style}

  图像要求:
  1. 漫画风格,线条清晰
  2. 色彩鲜明,对比度高
  3. 适合竖屏9:16比例
  4. 角色特征明确,表情生动
  5. 场景氛围感强,光影效果

  提示词规范:
  - 包含角色描述(服装、发型、表情)
  - 包含场景描述(环境、时间、氛围)
  - 包含风格描述(漫画风格、画风)
  - 包含技术描述(高清、细节、8k)

## 视频生成Prompt

video_generation: |
  生成AI漫剧视频片段。

  图像:{image_url}
  提示词:{prompt}
  时长:{duration}秒

  视频要求:
  1. 保持角色一致性
  2. 动作流畅自然
  3. 镜头运动平滑
  4. 光影效果协调
  5. 符合漫画风格

  提示词规范:
  - 包含镜头运动(平移、缩放、跟随)
  - 包含角色动作(表情变化、肢体动作)
  - 包含场景变化(时间变化、环境变化)
  - 包含特效提示(转场、滤镜)