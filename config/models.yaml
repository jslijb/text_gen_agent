  #      【2026-09-14 23:40 定稿，前两次判断都错了，以此为准】
  #      Agnes 有**两套互不通用的端点 + key 空间**，key 必须与域名配对：
  #        api.agnes-ai.cn/v1      <- 中文报错「无效的令牌」；配 sk-CioO… 这把
  #        apihub.agnes-ai.com/v1  <- 英文报错 "Invalid token"；配 sk-jY3Q… 那把
  #      实测（同一时刻分别用两把 key 打两个域名 /models + /chat/completions）：
  #        sk-CioO… (@.cn)    -> .cn 200 / apihub 401 Invalid token
  #        sk-jY3Q… (@apihub) -> apihub 200 / .cn 401 无效的令牌
  #      所以 401 的正确读法是「这把 key 不属于这个域名」，不是 key 坏、也不是域名错。
  #      当前 backend/.env 里是 .cn 空间那把 sk-CioO…，故 base_url = https://api.agnes-ai.cn/v1。
  #      Agnes 免费无配额，继续作为文本链路第一优先级。
  #   2) 百炼模型清单整体更新，旧模型 id 全部移除：
